<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificador de Imágenes IA</title>
    
    <!-- Icono para la pestaña del navegador y dispositivos móviles -->
    <link rel="icon" href="{{ url_for('static', filename='logo.png') }}" type="image/png">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='logo.png') }}">

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0b1329;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            background-color: #121e3b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        .logo-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
            border: 2px solid #00d2ff;
        }
        h2 {
            color: #00d2ff;
            margin-bottom: 20px;
        }
        input[type="file"] {
            margin-bottom: 20px;
            color: #ccc;
        }
        button {
            background-color: #00d2ff;
            color: #0b1329;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #0088cc;
            color: #ffffff;
        }
        .card {
            background-color: #1a2a56;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            text-align: left;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Logotipo visible en la interfaz -->
        <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo Verificador IA" class="logo-img">
        
        <h2>Verificador de Imágenes IA</h2>
        
        <form id="upload-form" enctype="multipart/form-data">
            <input type="file" name="imagen" id="file-input" required>
            <button type="submit">Analizar Imagen</button>
        </form>

        <div id="results" class="hidden" style="margin-top: 20px;">
            <div class="card">
                <h3>Dimensiones</h3>
                <p id="dim-val">-</p>
            </div>
            <div class="card">
                <h3>Índice FFT</h3>
                <p id="fft-val">-</p>
            </div>
            <div class="card">
                <h3>Nitidez</h3>
                <p id="nit-val">-</p>
            </div>
            <div class="card">
                <h3>Veredicto Preliminar</h3>
                <p id="verdict-val">-</p>
            </div>
        </div>
    </div>

</body>
</html>
