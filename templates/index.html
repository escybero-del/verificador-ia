<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificador de Imágenes con IA</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #fff; padding: 15px; margin: 0; }
        .container { max-width: 450px; margin: auto; background: #1e293b; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h2 { text-align: center; color: #38bdf8; font-size: 1.4em; margin-bottom: 20px; }
        .card { background: #334155; padding: 12px; margin: 10px 0; border-radius: 8px; text-align: center; }
        .card h3 { margin: 0 0 5px 0; font-size: 0.9em; color: #94a3b8; }
        .card p { margin: 0; font-size: 1.2em; font-weight: bold; color: #f8fafc; }
        .verdict { background: #0284c7; border: 1px solid #38bdf8; }
        input[type="file"] { width: 100%; margin: 10px 0; color: #cbd5e1; }
        button { background: #0ea5e9; color: white; border: none; padding: 12px; width: 100%; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 1em; }
        button:hover { background: #0284c7; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Verificador de Imágenes IA</h2>
        <form id="upload-form" enctype="multipart/form-data">
            <input type="file" name="imagen" id="file-input" required>
            <button type="submit">Analizar Imagen</button>
        </form>

        <div id="results" class="hidden" style="margin-top: 20px;">
            <div class="card">
                <h3>Dimensiones</h3>
                <p id="dim-val">-</p>
            </div>
            <div class="card">
                <h3>Índice FFT</h3>
                <p id="fft-val">-</p>
            </div>
            <div class="card">
                <h3>Nitidez</h3>
                <p id="nit-val">-</p>
            </div>
            <div class="card verdict">
                <h3>Veredicto Preliminar</h3>
                <p id="verdict-val">-</p>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('upload-form');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(form);
            
            try {
                const response = await fetch('/analizar', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                
                if(data.estado === "exito") {
                    document.getElementById('dim-val').innerText = data.dimensiones;
                    document.getElementById('fft-val').innerText = data.indice_fft;
                    document.getElementById('nit-val').innerText = data.nitidez;
                    document.getElementById('verdict-val').innerText = data.veredicto_preliminar;
                    
                    document.getElementById('results').classList.remove('hidden');
                } else {
                    alert(data.error || "Error al procesar la imagen");
                }
            } catch (err) {
                alert("Error de conexión con el servidor");
            }
        });
    </script>
</body>
</html>
